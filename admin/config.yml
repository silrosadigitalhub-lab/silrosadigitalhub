backend:
  name: github
  repo: silrosadigitalhub-lab/silrosadigitalhub
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:

  - name: "homepage"
    label: "Homepage"
    files:
      - name: "homepage"
        label: "Homepage Content"
        file: "content/homepage.yml"
        fields:
          - {label: "Main Heading", name: "heading", widget: "string"}
          - {label: "Introduction", name: "intro", widget: "text"}
          - {label: "Banner Text", name: "banner", widget: "string", required: false}
          - {label: "WhatsApp Number", name: "whatsapp", widget: "string"}
          - label: "Buttons"
            name: "buttons"
            widget: "list"
            fields:
              - {label: "Button Text", name: "text", widget: "string"}
              - {label: "Link (URL or WhatsApp link)", name: "link", widget: "string"}

  - name: "services"
    label: "Services"
    files:
      - name: "services"
        label: "Website Services"
        file: "content/services.yml"
        fields:
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - {label: "Service Name", name: "name", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Price (KSh)", name: "price", widget: "string"}

  - name: "gallery"
    label: "Gallery"
    files:
      - name: "gallery"
        label: "Gallery Images"
        file: "content/gallery.yml"
        fields:
          - label: "Images"
            name: "images"
            widget: "list"
            fields:
              - {label: "Photo", name: "image", widget: "image"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text", required: false}

  - name: "contact"
    label: "Contact Information"
    files:
      - name: "contact"
        label: "Contact Details"
        file: "content/contact.yml"
        fields:
          - {label: "Phone Number", name: "phone", widget: "string"}
          - {label: "WhatsApp Number", name: "whatsapp", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Location", name: "location", widget: "string"}
          - {label: "Opening Hours", name: "hours", widget: "string"}

  - name: "announcements"
    label: "Announcements"
    folder: "content/announcements"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Message", name: "body", widget: "text"}
      - {label: "Active", name: "active", widget: "boolean", default: true}
